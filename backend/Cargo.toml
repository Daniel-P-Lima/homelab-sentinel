[package]
name = "homelab-sentinel"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bollard = "0.15"
futures-util = "0.3"
thiserror = "1"
indexmap = "=2.2.6"
time = "=0.3.36"
idna_adapter = "=1.1.0"
