[package]
name = "homelab-sentinel"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bollard = "0.15"
futures-util = "0.3"
thiserror = "1"
# sem default features: o Pi-hole é falado por HTTP na LAN, sem TLS — evita
# puxar openssl/rustls pra imagem
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# statvfs (uso do disco), que a std não expõe — ver host.rs
libc = "0.2"
indexmap = "=2.2.6"
time = "=0.3.36"
idna_adapter = "=1.1.0"
