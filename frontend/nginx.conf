server {
    listen 80;

    # DNS interno do Docker. Com proxy_pass usando variável, o Nginx resolve
    # o nome a cada request (respeitando o TTL) em vez de só no boot — senão,
    # quando o backend é recriado e muda de IP, o proxy fica apontando pro
    # container antigo até reiniciar o frontend.
    resolver 127.0.0.11 valid=10s;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend http://sentinel-backend:8087;
        # sem URI no proxy_pass: repassa o caminho original (/api/...) intacto
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
}
