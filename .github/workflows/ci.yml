name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Mesma versão do backend/Dockerfile: com stable, uma dependência que
      # exigisse Rust mais novo passaria no CI e quebraria o build da imagem.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.80
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: cargo build
        run: cargo build --locked --verbose

      - name: cargo test
        run: cargo test --locked --verbose

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  frontend:
    name: Frontend (Vue + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Type-check (vue-tsc)
        run: npx vue-tsc -b

      - name: Build
        run: npm run build
